# Money Manager: nginx site on the VM.
# Installed as /etc/nginx/sites-available/money-manager (enabled via symlink).
#
# - Port 80: answers Let's Encrypt renewal challenges (the IP certificate is
#   short-lived and renews every few days through /var/www/letsencrypt), and
#   redirects everything else to HTTPS. Keep the acme-challenge location.
# - Port 443: serves the frontend's static files from /var/www/money-manager
#   and forwards /api to the backend on 127.0.0.1:8787.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 138.2.66.148 138-2-66-148.sslip.io;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}


server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 138.2.66.148;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/138.2.66.148/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/138.2.66.148/privkey.pem;

    # The friendly address is the sslip.io name; send IP visitors there.
    location / {
        return 308 https://138-2-66-148.sslip.io$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 138-2-66-148.sslip.io;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/138-2-66-148.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/138-2-66-148.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers. The app needs 'wasm-unsafe-eval' for libsodium (WebAssembly)
    # and inline style attributes; it loads nothing from other sites.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    client_max_body_size 8m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    root /var/www/money-manager;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Built files have content hashes in their names: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Single-page app: every other path serves index.html, never cached.
    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        try_files $uri /index.html;
    }
}
