# Money Manager: nginx site (placeholder until go-live, M5)
#
# Installed on the VM as /etc/nginx/sites-available/money-manager
# (enabled via a symlink in /etc/nginx/sites-enabled/).
#
# For now it only:
#   - answers Let's Encrypt renewal challenges on port 80 (the IP certificate
#     is short-lived and renews every few days through /var/www/letsencrypt)
#   - redirects everything else to HTTPS
#   - shows a "coming soon" placeholder over HTTPS
#
# At go-live, the HTTPS blocks will serve the frontend's static files and
# forward /api to the backend on localhost.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 138.2.66.148 138-2-66-148.sslip.io;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# Shared HTTPS settings are repeated per server block for clarity.

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 138.2.66.148;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/138.2.66.148/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/138.2.66.148/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        default_type text/plain;
        return 200 "Money Manager: coming soon.\n";
    }
}

