# Production backend on the VM (/opt/money-manager/compose.yml).
# The backend is one bundled file (app/server.mjs) run by the official Node image.
# It listens only on 127.0.0.1; nginx forwards /api to it.
services:
  backend:
    image: node:24-bookworm-slim
    user: "1000:1000"
    working_dir: /app
    command: ["node", "--no-warnings", "/app/server.mjs"]
    environment:
      MM_ENV: production
      MM_HOST: 0.0.0.0
      MM_PORT: "8787"
      MM_DATA_DIR: /data
      TZ: Asia/Dhaka
    volumes:
      - ./app:/app:ro
      - ./data:/data
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
