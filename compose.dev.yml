# Isolated development environment. Nothing is installed on the host:
# node_modules live in Docker volumes, the database in the "devdata" volume.
#
#   ./scripts/dev.sh npm install        # install dependencies
#   ./scripts/dev.sh npm test           # run all tests
#   docker compose -f compose.dev.yml up backend frontend   # run the app
#                                        # then open http://localhost:5173

x-node: &node
  image: node:24-bookworm-slim
  working_dir: /app
  user: "node"
  volumes:
    - .:/app
    - node_modules:/app/node_modules
    - shared_node_modules:/app/shared/node_modules
    - backend_node_modules:/app/backend/node_modules
    - frontend_node_modules:/app/frontend/node_modules
    - devdata:/data
  environment:
    MM_DATA_DIR: /data
    MM_ENV: development
    npm_config_update_notifier: "false"

services:
  # Fresh Docker volumes are owned by root; hand them to the "node" user once.
  init:
    <<: *node
    user: root
    command: ["sh", "-c", "chown node:node /app/node_modules /app/shared/node_modules /app/backend/node_modules /app/frontend/node_modules /data"]

  dev:
    <<: *node
    profiles: ["tools"]
    command: ["bash"]

  backend:
    <<: *node
    command: ["npm", "run", "dev", "-w", "backend"]
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      MM_DATA_DIR: /data
      MM_ENV: development
      MM_HOST: 0.0.0.0
      MM_PORT: "8787"
    ports:
      - "127.0.0.1:8787:8787"

  frontend:
    <<: *node
    command: ["npm", "run", "dev", "-w", "frontend", "--", "--host", "0.0.0.0"]
    environment:
      MM_API_TARGET: http://backend:8787
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      init:
        condition: service_completed_successfully
      backend:
        condition: service_started

volumes:
  node_modules:
  shared_node_modules:
  backend_node_modules:
  frontend_node_modules:
  devdata:
